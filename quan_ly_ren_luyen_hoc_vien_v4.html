<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý rèn luyện học viên</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#e6eaf0;--primary:#2563eb;--primary2:#1d4ed8;--danger:#dc2626;--shadow:0 8px 28px rgba(20,35,60,.08);--radius:16px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:flex;min-height:100vh}.side{width:250px;background:#111827;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:18px;line-height:1.25;margin-bottom:24px}.brand small{display:block;color:#9ca3af;font-weight:500;font-size:12px;margin-top:5px}.nav button{width:100%;border:0;background:transparent;color:#d1d5db;text-align:left;padding:12px 14px;border-radius:10px;margin:3px 0;cursor:pointer;font-size:14px}.nav button:hover,.nav button.active{background:#1f2937;color:#fff}.main{flex:1;padding:24px 28px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:24px}.sub{color:var(--muted);font-size:13px;margin-top:4px}.select{border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:10px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.metric{font-size:28px;font-weight:800;margin-top:6px}.label{font-size:12px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}.panel h2{font-size:16px;margin:0 0 14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.input,.btn,select{font:inherit;border:1px solid #dbe1ea;border-radius:10px;padding:10px 12px;background:#fff}.input{min-width:220px}.btn{cursor:pointer}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.primary:hover{background:var(--primary2)}.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:middle}th{background:#f8fafc;text-align:left;color:#475569;font-weight:700;position:sticky;top:0}tr:hover td{background:#fbfdff}.scroll{overflow:auto;max-height:62vh}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.good{background:#dcfce7;color:#166534}.ok{background:#dbeafe;color:#1d4ed8}.mid{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.neutral{background:#eef2f7;color:#475569}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12px;color:#64748b;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;font:inherit;border:1px solid #dbe1ea;border-radius:10px;padding:10px}.field textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.hint{font-size:12px;color:#64748b;background:#f8fafc;padding:10px;border-radius:10px}.notice{padding:11px 13px;border-radius:10px;background:#eff6ff;color:#1e40af;font-size:13px;margin-bottom:14px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:9px;cursor:pointer}.tabs button.active{background:#111827;color:#fff;border-color:#111827}
@media(max-width:900px){.side{width:76px}.brand span,.brand small,.nav button span{display:none}.nav button{text-align:center}.main{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body><div class="app"><aside class="side"><div class="brand">RÈN LUYỆN<span> HỌC VIÊN</span><small>Demo lớp 11A1 • 2026–2027</small></div><div class="nav">
<button data-page="dashboard">🏠 <span>Tổng quan</span></button><button data-page="students">👥 <span>Danh sách học viên</span></button><button data-page="violations">⚠️ <span>Nhập vi phạm</span></button><button data-page="semester">📊 <span>HKI / HKII</span></button><button data-page="year">📋 <span>Cả năm</span></button><button data-page="rules">⚙️ <span>Danh mục & quy tắc</span></button></div></aside>
<main class="main"><div id="app"></div></main></div>
<script>
let students = JSON.parse(localStorage.getItem("renluyen_students_v1") || "null");
if(!Array.isArray(students)){ students = []; }
function normalizeStudents(rows){let out=[];rows.forEach(row=>{let name=String(row.name||"").trim();let cls=String(row.className||"11A1").trim()||"11A1";if(name)out.push({id:out.length+1,name,className:cls})});return out}
const rules=[
['Đánh nhau trong và ngoài Trung tâm','Nghiêm trọng',0,0,'CHƯA ĐẠT'],['Vi phạm quy chế thi/kiểm tra','Nghiêm trọng',0,0,'CHƯA ĐẠT'],['Vô lễ, xúc phạm thầy cô, người lớn','Nghiêm trọng',0,0,'CHƯA ĐẠT'],['Trộm cắp tài sản','Nghiêm trọng',0,0,'CHƯA ĐẠT'],['Phá hoại tài sản nhà trường','Nghiêm trọng',0,0,'CHƯA ĐẠT'],['Đánh bài, uống rượu bia trong trường','Nghiêm trọng',0,0,'CHƯA ĐẠT'],['Tuyên truyền văn hóa phẩm đồi trụy/vi phạm Luật ANM','Nghiêm trọng',0,0,'CHƯA ĐẠT'],['Sử dụng điện thoại trong giờ học','Thông thường',5,15,'Tái phạm: tối đa Đạt'],['Nghỉ học có phép','Thông thường',0,0,'>15 buổi: hạ 1 bậc rèn luyện'],['Hút thuốc lá trong Trung tâm','Thông thường',0,0,'Lần 1: hạ 1 bậc; tái phạm: Chưa đạt'],['Nói tục, chửi thề','Thông thường',2,2,'Trừ 2–5 điểm/lần; điều chỉnh tại cột nhập'],['Nghỉ học không phép, cúp tiết','Thông thường',5,5,'Trừ 5–10 điểm/buổi; >15 buổi hạ bậc'],['Đi học trễ','Thông thường',2,2,'Trừ 2 điểm/lần'],['Đi dép khi đến trường','Thông thường',2,2,'Trừ 2 điểm/lần'],['Mặc trang phục, đeo phù hiệu không đúng quy định','Thông thường',2,2,'Trừ 2 điểm/lần'],['Tác phong học sinh không đạt yêu cầu','Thông thường',2,2,'Trừ 2 điểm/lần'],['Sơn móng tay móng chân, đeo nhiều bông tai','Thông thường',2,2,'Trừ 2 điểm/lần'],['Không thuộc bài, không chuẩn bị bài','Thông thường',2,2,'Trừ 2 điểm/lần'],['Mất trật tự, không chấp hành yêu cầu giáo viên','Thông thường',2,2,'Trừ 2–5 điểm/lần; điều chỉnh tại cột nhập'],['Xả rác trong lớp và khuôn viên','Thông thường',2,2,'Trừ 2 điểm/lần'],['Vi phạm quy tắc ứng xử trên mạng xã hội','Thông thường',5,5,'Trừ 5–10 điểm tùy mức độ; điều chỉnh tại cột nhập']
].map((x,i)=>({id:i+1,name:x[0],type:x[1],first:x[2],repeat:x[3],action:x[4]}));
const KEY='renluyen_demo_v1'; let data=JSON.parse(localStorage.getItem(KEY)||'{"violations":[]}');
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function getCurrentClass(){return (localStorage.getItem('renluyen_current_class')||'11A1').trim()||'11A1'}
function setCurrentClass(v){let cls=String(v||'').trim()||'11A1';localStorage.setItem('renluyen_current_class',cls);return cls}
const startHKII=new Date('2027-01-05T00:00:00');
function semester(date){return new Date(date)<startHKII?'HKI':'HKII'}
function levelClass(v){return v==='Tốt'?'good':v==='Khá'?'ok':v==='Đạt'?'mid':v==='Chưa đạt'?'bad':'neutral'}
function calc(s,sem){let vs=data.violations.filter(v=>v.studentId===s.id&&v.sem===sem), score=100, serious=0, phone=0, smoke=0, paid=0, unpaid=0;
vs.forEach(v=>{const r=rules.find(x=>x.id==v.ruleId); if(!r)return; const n=Number(v.sessions||1); if(r.name==='Nghỉ học có phép') paid+=n; if(r.name.startsWith('Nghỉ học không phép')) unpaid+=n; if(r.type==='Nghiêm trọng') serious++; if(r.name.startsWith('Sử dụng điện thoại')) phone++; if(r.name.startsWith('Hút thuốc')) smoke++; let d=v.adjusted!==''&&v.adjusted!=null?Number(v.adjusted):(vs.filter(z=>z.ruleId===v.ruleId&&z.date<=v.date).length>1?r.repeat:r.first); score-=d*n;}); score=Math.max(0,score); let restriction='';
const total=paid+unpaid; if(serious) restriction='Lỗi nghiêm trọng → Chưa đạt'; else if(smoke>=2) restriction='Hút thuốc tái phạm → Chưa đạt'; else if(phone>=2) restriction='Điện thoại tái phạm → tối đa Đạt'; else if(smoke===1) restriction='Hút thuốc lần 1 → hạ 1 bậc'; else if(total>45) restriction='Tổng nghỉ >45 buổi → Chưa đạt'; else if(total>30) restriction='Tổng nghỉ >30 buổi → hạ 2 bậc'; else if(total>15) restriction='Tổng nghỉ >15 buổi → hạ 1 bậc';
let base=score>=90?(phone>=2?'Đạt':'Tốt'):score>=75?'Khá':score>=50?'Đạt':'Chưa đạt'; let level=base;
if(serious||smoke>=2||total>45) level='Chưa đạt'; else if(phone>=2) level=base==='Tốt'?'Đạt':base; else if(smoke===1||total>15){let steps=total>30?2:1; const order=['Chưa đạt','Đạt','Khá','Tốt']; level=order[Math.max(0,order.indexOf(base)-steps)];}
return {score,serious,phone,smoke,paid,unpaid,total,restriction,level,count:vs.length};}
function yearLevel(a,b){if(!a||!b)return ''; if(b==='Tốt'&&(a==='Tốt'||a==='Khá'))return'Tốt'; if((b==='Khá'&&['Khá','Đạt','Chưa đạt'].includes(a))||(b==='Đạt'&&a==='Tốt')||(b==='Tốt'&&['Đạt','Chưa đạt'].includes(a)))return'Khá'; if((b==='Đạt'&&['Khá','Đạt','Chưa đạt'].includes(a))||(b==='Khá'&&a==='Chưa đạt'))return'Đạt'; return'Chưa đạt'}
function page(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p)); if(p==='dashboard')dashboard(); if(p==='students')studentsPage(); if(p==='violations')violationPage(); if(p==='semester')semesterPage(); if(p==='year')yearPage(); if(p==='rules')rulesPage()}
function shell(title,sub,body){document.getElementById('app').innerHTML=`<div class="top"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div><input id="classSelect" class="select" value="${getCurrentClass()}" placeholder="Nhập lớp (VD: 11A1)" title="Nhập tên lớp tự do" onchange="setCurrentClass(this.value)"></div></div>${body}`}
function dashboard(){let hi=students.map(s=>calc(s,'HKI')), h2=students.map(s=>calc(s,'HKII')); let total=data.violations.length; shell('Tổng quan','Theo dõi rèn luyện học viên • dữ liệu demo lưu ngay trên trình duyệt',`<div class="cards"><div class="card"><div class="label">Học viên</div><div class="metric">${students.length}</div></div><div class="card"><div class="label">Vi phạm đã nhập</div><div class="metric">${total}</div></div><div class="card"><div class="label">HKI · Tốt</div><div class="metric">${hi.filter(x=>x.level==='Tốt').length}</div></div><div class="card"><div class="label">HKII · Tốt</div><div class="metric">${h2.filter(x=>x.level==='Tốt').length}</div></div></div><div class="panel"><h2>Quy tắc đang áp dụng</h2><div class="notice"><b>Tổng nghỉ = nghỉ có phép + nghỉ không phép:</b> &gt;15 buổi hạ 1 bậc; &gt;30 buổi hạ 2 bậc; &gt;45 buổi Chưa đạt. Ngày từ 05/01/2027 được tính HKII.</div><div class="toolbar"><button class="btn primary" onclick="page('violations')">+ Nhập vi phạm</button><button class="btn" onclick="page('semester')">Xem HKI / HKII</button><button class="btn" onclick="page('year')">Xem cả năm</button></div></div>`)}
function studentsPage(){shell("Danh sách học viên","Quản lý danh sách: nhập thủ công hoặc nhập từ Excel",`<div class="panel"><div class="toolbar"><input id="studentSearch" class="input" placeholder="Tìm học viên..." oninput="renderStudents()"><button class="btn primary" onclick="showStudentImport()">+ Nhập danh sách mới</button><button class="btn" onclick="exportExcel()">📥 Xuất Excel</button><label class="btn" style="cursor:pointer">📊 Nhập Excel<input id="excelFile" type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="importExcel(event)"></label><button class="btn danger" onclick="clearStudents()">🗑️ Xóa danh sách</button></div><div id="studentImportBox"></div><div class="scroll"><table><thead><tr><th>STT</th><th>Họ và tên</th><th>Lớp</th><th>HKI</th><th>HKII</th></tr></thead><tbody id="studentRows"></tbody></table></div></div>`);renderStudents()}
function showStudentImport(){document.getElementById("studentImportBox").innerHTML=`<div class="notice"><b>Nhập danh sách mới:</b> mỗi dòng một học viên. Có thể nhập <code>HỌ TÊN | LỚP</code>.</div><textarea id="newStudentList" class="input" style="width:100%;min-height:160px" placeholder="NGUYỄN VĂN A | 11A1&#10;TRẦN THỊ B | 11A1"></textarea><br><br><button class="btn primary" onclick="saveManualStudents()">Lưu danh sách mới</button> <button class="btn" onclick="document.getElementById("studentImportBox").innerHTML=""">Hủy</button>`}
function replaceStudents(list){let clean=normalizeStudents(list);if(!clean.length){alert("Không tìm thấy học viên hợp lệ.");return false}if(!confirm("Thay toàn bộ danh sách hiện tại bằng "+clean.length+" học viên? Dữ liệu vi phạm hiện tại sẽ được xóa."))return false;students=clean;data.violations=[];localStorage.setItem("renluyen_students_v1",JSON.stringify(students));save();page("students");return true}
function saveManualStudents(){let text=document.getElementById("newStudentList")?.value||"";let list=text.split(/\r?\n/).map(line=>{let parts=line.split("|");return{name:(parts[0]||"").trim(),className:(parts[1]||getCurrentClass()).trim()}}).filter(x=>x.name);replaceStudents(list)}
function exportExcel(){
if(typeof XLSX==="undefined"){alert("Không tải được thư viện Excel. Hãy mở file khi có Internet rồi thử lại.");return}
if(!students.length){alert("Chưa có danh sách học viên để xuất.");return}
const cls=getCurrentClass();
const studentRows=students.map((s,i)=>{const a=calc(s,"HKI"),b=calc(s,"HKII");return {"STT":i+1,"Họ và tên":s.name,"Lớp":s.className,"HKI":a.level,"Điểm HKI":Number(a.score.toFixed(2)),"HKII":b.level,"Điểm HKII":Number(b.score.toFixed(2)),"Cả năm":yearLevel(a.level,b.level)}});
const violationRows=data.violations.map((v,i)=>{const s=students.find(x=>x.id===v.studentId);const r=rules.find(x=>x.id==v.ruleId);const same=data.violations.filter(z=>z.studentId===v.studentId&&z.sem===v.sem&&z.ruleId===v.ruleId&&z.date<=v.date);const deduction=v.adjusted!==''&&v.adjusted!=null?Number(v.adjusted):(same.length>1?r?.repeat||0:r?.first||0);return {"STT":i+1,"Ngày":v.date,"Họ và tên":s?.name||"","Lớp":s?.className||cls,"Học kỳ":v.sem,"Nhóm lỗi":r?.name||v.ruleId,"Số buổi":Number(v.sessions||1),"Điểm trừ":Number((deduction*(Number(v.sessions)||1)).toFixed(2)),"Ghi chú":v.note||""}});
const hkiRows=students.map((s,i)=>{const a=calc(s,"HKI");return {"STT":i+1,"Họ và tên":s.name,"Lớp":s.className,"Mức rèn luyện":a.level,"Điểm":Number(a.score.toFixed(2)),"Nghỉ có phép":a.paid,"Nghỉ không phép":a.unpaid,"Tổng nghỉ":a.total,"Số lần vi phạm":a.count,"Ghi chú xử lý":a.restriction}});
const hkiiRows=students.map((s,i)=>{const b=calc(s,"HKII");return {"STT":i+1,"Họ và tên":s.name,"Lớp":s.className,"Mức rèn luyện":b.level,"Điểm":Number(b.score.toFixed(2)),"Nghỉ có phép":b.paid,"Nghỉ không phép":b.unpaid,"Tổng nghỉ":b.total,"Số lần vi phạm":b.count,"Ghi chú xử lý":b.restriction}});
const wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(studentRows),"Danh sách");
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(hkiRows),"HKI");
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(hkiiRows),"HKII");
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(violationRows),"Vi phạm");
const yearRows=students.map((s,i)=>{const a=calc(s,"HKI"),b=calc(s,"HKII");return {"STT":i+1,"Họ và tên":s.name,"Lớp":s.className,"HKI":a.level,"HKII":b.level,"Cả năm":yearLevel(a.level,b.level),"Điểm HKI":Number(a.score.toFixed(2)),"Điểm HKII":Number(b.score.toFixed(2))}});
XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(yearRows),"Cả năm");
const safeClass=String(cls).replace(/[^a-zA-Z0-9À-ỹ_-]+/g,"_")||"lop";
XLSX.writeFile(wb,"Quan_ly_ren_luyen_"+safeClass+".xlsx");
}
function importExcel(event){let file=event.target.files?.[0];if(!file)return;if(typeof XLSX==="undefined"){alert("Không tải được thư viện Excel. Hãy mở file khi có Internet rồi thử lại.");return}let reader=new FileReader();reader.onload=e=>{try{let wb=XLSX.read(e.target.result,{type:"array"});let ws=wb.Sheets[wb.SheetNames[0]];let rows=XLSX.utils.sheet_to_json(ws,{defval:""});if(!rows.length){alert("File Excel không có dữ liệu.");return}let keys=Object.keys(rows[0]);let nameKey=keys.find(k=>/họ.*tên|ho.*ten|tên|ten|name/i.test(k))||keys[0];let classKey=keys.find(k=>/lớp|lop|class/i.test(k));replaceStudents(rows.map(r=>({name:r[nameKey],className:classKey?r[classKey]:getCurrentClass()})))}catch(err){console.error(err);alert("Không đọc được file Excel: "+err.message)}};reader.readAsArrayBuffer(file)}
function clearStudents(){if(!confirm("Xóa toàn bộ danh sách học viên và toàn bộ dữ liệu vi phạm?"))return;students=[];data.violations=[];localStorage.setItem("renluyen_students_v1","[]");save();page("students")}
function renderStudents(){let q=(document.getElementById('studentSearch')?.value||'').toLowerCase();let arr=students.filter(s=>s.name.toLowerCase().includes(q));document.getElementById('studentRows').innerHTML=arr.map((s,i)=>{let a=calc(s,'HKI'),b=calc(s,'HKII');return `<tr><td>${s.id}</td><td><b>${s.name}</b></td><td>${s.className}</td><td><span class="badge ${levelClass(a.level)}">${a.level}</span></td><td><span class="badge ${levelClass(b.level)}">${b.level}</span></td></tr>`}).join('')}
function violationPage(){shell('Nhập vi phạm','Mỗi dòng là một lần ghi nhận; hệ thống tự xác định HKI/HKII theo ngày',`<div class="panel"><div class="notice">Dữ liệu demo được lưu bằng <b>localStorage</b>. Bạn có thể thử nhập, sửa logic và tải lại trang mà dữ liệu vẫn còn trên máy.</div><form id="vform"><div class="formgrid"><div class="field"><label>Ngày</label><input type="date" id="vdate" required></div><div class="field"><label>Học viên</label><select id="vstudent">${students.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div><div class="field"><label>Nhóm lỗi</label><select id="vrule">${rules.map(r=>`<option value="${r.id}">${r.id}. ${r.name}</option>`).join('')}</select></div><div class="field"><label>Số buổi / lần</label><input type="number" id="vsessions" value="1" min="1"></div><div class="field"><label>Điểm trừ điều chỉnh (bỏ trống = mặc định)</label><input type="number" id="vadjust" min="0" step="1"></div><div class="field"><label>Học kỳ tự xác định</label><input id="vsem" readonly value="HKI"></div><div class="field full"><label>Ghi chú</label><textarea id="vnote"></textarea></div></div><br><button class="btn primary" type="submit">Lưu vi phạm</button></form></div><div class="panel"><h2>Lịch sử vi phạm</h2><div class="scroll"><table><thead><tr><th>Ngày</th><th>Học viên</th><th>Học kỳ</th><th>Nhóm lỗi</th><th>Số buổi</th><th>Điểm trừ</th><th></th></tr></thead><tbody id="vrows"></tbody></table></div></div>`);document.getElementById('vdate').value=new Date().toISOString().slice(0,10); document.getElementById('vdate').onchange=()=>document.getElementById('vsem').value=semester(document.getElementById('vdate').value); document.getElementById('vform').onsubmit=e=>{e.preventDefault();data.violations.push({id:Date.now(),date:vdate.value,studentId:Number(vstudent.value),ruleId:Number(vrule.value),sessions:Number(vsessions.value)||1,adjusted:vadjust.value===''?'':Number(vadjust.value),note:vnote.value,sem:semester(vdate.value)});save();e.target.reset();vdate.value=new Date().toISOString().slice(0,10);vsem.value=semester(vdate.value);renderViolations();};renderViolations()}
function renderViolations(){let rows=[...data.violations].sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('vrows').innerHTML=rows.length?rows.map(v=>{let s=students.find(x=>x.id===v.studentId),r=rules.find(x=>x.id===v.ruleId);return `<tr><td>${v.date}</td><td>${s?.name||''}</td><td>${v.sem}</td><td>${r?.name||''}</td><td>${v.sessions}</td><td>${v.adjusted===''?'mặc định':v.adjusted}</td><td><button class="btn danger" onclick="delV(${v.id})">Xóa</button></td></tr>`}).join(''):'<tr><td colspan="7" style="text-align:center;color:#64748b">Chưa có dữ liệu.</td></tr>'}
function delV(id){data.violations=data.violations.filter(v=>v.id!==id);save();renderViolations()}
function semesterPage(){shell('Tổng hợp HKI / HKII','Bảng tự tính từ dữ liệu vi phạm',`<div class="tabs"><button id="t1" class="active" onclick="renderSem('HKI')">HKI</button><button id="t2" onclick="renderSem('HKII')">HKII</button></div><div class="panel"><div class="scroll"><table><thead><tr><th>STT</th><th>Họ và tên</th><th>Điểm còn lại</th><th>Lỗi nghiêm trọng</th><th>Điện thoại</th><th>Hút thuốc</th><th>Nghỉ CP</th><th>Nghỉ KP</th><th>Tổng nghỉ</th><th>Khống chế đặc biệt</th><th>Mức rèn luyện</th></tr></thead><tbody id="semRows"></tbody></table></div></div>`);renderSem('HKI')}
function renderSem(sem){document.getElementById('t1')?.classList.toggle('active',sem==='HKI');document.getElementById('t2')?.classList.toggle('active',sem==='HKII');document.getElementById('semRows').innerHTML=students.map((s,i)=>{let x=calc(s,sem);return `<tr><td>${i+1}</td><td><b>${s.name}</b></td><td>${x.score}</td><td>${x.serious}</td><td>${x.phone}</td><td>${x.smoke}</td><td>${x.paid}</td><td>${x.unpaid}</td><td><b>${x.total}</b></td><td>${x.restriction||'—'}</td><td><span class="badge ${levelClass(x.level)}">${x.level}</span></td></tr>`}).join('')}
function yearPage(){shell('Kết quả cả năm','Tự lấy kết quả HKI và HKII rồi áp dụng quy tắc cả năm của file DEMO',`<div class="panel"><div class="scroll"><table><thead><tr><th>STT</th><th>Họ và tên</th><th>HKI</th><th>HKII</th><th>Kết quả cả năm</th></tr></thead><tbody>${students.map((s,i)=>{let a=calc(s,'HKI').level,b=calc(s,'HKII').level,y=yearLevel(a,b);return `<tr><td>${i+1}</td><td><b>${s.name}</b></td><td><span class="badge ${levelClass(a)}">${a}</span></td><td><span class="badge ${levelClass(b)}">${b}</span></td><td><span class="badge ${levelClass(y)}">${y||'—'}</span></td></tr>`}).join('')}</tbody></table></div></div>`)}
function rulesPage(){shell('Danh mục & quy tắc','Danh mục lấy từ file Excel DEMO',`<div class="panel"><div class="scroll"><table><thead><tr><th>STT</th><th>Nhóm lỗi</th><th>Phân loại</th><th>Lần 1</th><th>Lần 2+</th><th>Khống chế / xử lý</th></tr></thead><tbody>${rules.map(r=>`<tr><td>${r.id}</td><td>${r.name}</td><td>${r.type}</td><td>${r.first}</td><td>${r.repeat}</td><td>${r.action}</td></tr>`).join('')}</tbody></table></div></div>`)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));page('dashboard');
</script></body></html>
